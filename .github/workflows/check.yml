name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Checker tests
        run: node --test scripts/*.test.mjs

      - name: Check every plugin package
        run: node scripts/check-package.mjs --all

      - name: Validate the marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.317 plugin validate --strict .

      - name: Validate each plugin
        run: |
          set -euo pipefail
          if [ ! -d plugins ]; then
            echo "::error::plugins/ does not exist: no plugin to validate"
            exit 1
          fi
          count=0
          for dir in plugins/*/; do
            [ -d "$dir" ] || continue
            echo "Validating $dir"
            npx -y @anthropic-ai/claude-code@2.1.317 plugin validate --strict --profile directory "$dir"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::plugins/ has no plugin folder: nothing was validated"
            exit 1
          fi
          echo "Validated $count plugin(s)"

      - name: Scan the repository for secrets
        run: |
          set -euo pipefail
          overrides=$(git ls-files | grep -E '(^|/)\.gitleaks(\.toml|ignore)$' || true)
          if [ -n "$overrides" ]; then
            echo "::error::gitleaks overrides are tracked and could weaken the scan: $overrides"
            exit 1
          fi
          version=8.24.0
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected=cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "$expected  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --exit-code 1
          "$RUNNER_TEMP/gitleaks" dir . --redact --exit-code 1
